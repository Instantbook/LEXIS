<style>
  @import url('https://fonts.googleapis.com/css2?family=GFS+Didot&family=Source+Sans+3:wght@400;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#F7F5F0 0%,#EFEDE6 100%);
         font-family:'Source Sans 3','Noto Sans',system-ui,sans-serif; color:#1F2933; }
  .display { font-family:'GFS Didot','Georgia',serif; }
  header { background:#1E3A5C; color:#F7F5F0; padding:calc(16px + env(safe-area-inset-top)) 16px 14px; }
  .hrow { max-width:680px; margin:0 auto; display:flex; justify-content:space-between; align-items:baseline; }
  .shell { max-width:680px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)); }
  .tabs { max-width:680px; margin:0 auto; display:flex; gap:8px; padding:14px 16px 4px; flex-wrap:wrap; }
  .chip { padding:8px 14px; border-radius:999px; border:1.5px solid rgba(30,58,92,.25); background:transparent;
          color:#1E3A5C; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .chip.on { border-color:#1E3A5C; background:#1E3A5C; color:#F7F5F0; }
  .btn { padding:12px 20px; border-radius:10px; border:none; background:#1E3A5C; color:#F7F5F0;
         font-weight:600; font-size:15px; cursor:pointer; font-family:inherit; }
  .btn.sec { background:transparent; border:1.5px solid #1E3A5C; color:#1E3A5C; }
  .btn:disabled { opacity:.55; }
  .card { background:#fff; border-radius:14px; padding:20px; margin-top:12px;
          box-shadow:0 1px 3px rgba(31,41,51,.08),0 8px 24px rgba(31,41,51,.05); }
  .word { cursor:pointer; border-bottom:1px dotted rgba(30,58,92,.35); border-radius:2px; }
  .sentence { border-radius:5px; transition:background .2s ease; padding:1px 0; }
  .sentence.active { background:rgba(200,155,60,.20); box-shadow:0 0 0 3px rgba(200,155,60,.20); }
  .word.known { border-bottom:2px solid #C89B3C; background:rgba(200,155,60,.12); }
  .passage { font-size:19px; line-height:2.05; margin:14px 0 4px; }
  .muted { font-size:12.5px; color:#6B7683; }
  .lookup { border-left:4px solid #C89B3C; }
  .grades { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
  .grades button { padding:12px 4px; border-radius:10px; border:none; color:#fff; font-weight:700;
                   font-size:14px; cursor:pointer; font-family:inherit; }
  input[type=text], input[type=password], select {
    width:100%; padding:12px; border-radius:10px; border:1.5px solid rgba(30,58,92,.3);
    font-size:15px; font-family:inherit; background:#fff; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.04em; }
  .badge.bundled { background:rgba(30,58,92,.1); color:#1E3A5C; }
  .badge.cached { background:rgba(200,155,60,.18); color:#8A6D1F; }
  .hidden { display:none; }
</style>
</head>

{id:"panigiri",level:"B1",topic:"Village life",title:"Το πανηγύρι του χωριού",
text:"Κάθε καλοκαίρι, στις δεκαπέντε Αυγούστου, το χωριό μας γιορτάζει το μεγάλο πανηγύρι της Παναγίας. Από το πρωί οι καμπάνες χτυπούν χαρούμενα και οι γυναίκες στολίζουν την εκκλησία με λουλούδια. Το βράδυ, στην πλατεία, στήνονται τραπέζια κάτω από τα πλατάνια. Οι οργανοπαίχτες κουρδίζουν τα όργανά τους και σιγά σιγά αρχίζει ο χορός. Ψήνονται σουβλάκια και αρνιά στη σούβλα, ενώ το κρασί ρέει άφθονο. Οι ξενιτεμένοι επιστρέφουν από το εξωτερικό για να βρεθούν με τους δικούς τους. Μικροί και μεγάλοι πιάνονται χέρι χέρι και χορεύουν μέχρι τα ξημερώματα. Το πανηγύρι δεν είναι απλώς μια γιορτή· είναι η ψυχή του χωριού.",

{id:"giagia",level:"B1",topic:"Food",title:"Η κουζίνα της γιαγιάς",
text:"Η γιαγιά μου ξυπνούσε πάντα με το χάραμα. Ζύμωνε ψωμί στη σκάφη και το έψηνε στον ξυλόφουρνο της αυλής. Η μυρωδιά απλωνόταν σε όλη τη γειτονιά. Το μεσημέρι μαγείρευε φαγητά κατσαρόλας: φασολάκια λαδερά, γεμιστά, μοσχάρι κοκκινιστό. Τα μυστικά της ήταν απλά — φρέσκα υλικά από τον κήπο, λάδι από τις δικές μας ελιές και υπομονή. Ποτέ δεν μετρούσε με ακρίβεια· έβαζε «όσο πάρει». Εμείς τα παιδιά κλέβαμε κομμάτια ζεστό ψωμί και μας κυνηγούσε γελώντας με την ποδιά της. Σήμερα προσπαθώ να φτιάξω τις συνταγές της, μα κάτι πάντα λείπει.",

{id:"tourismos",level:"B2",topic:"News",title:"Ο τουρισμός φέτος",
text:"Σύμφωνα με τα στοιχεία του υπουργείου, οι αφίξεις τουριστών σημείωσαν φέτος νέο ρεκόρ. Τα νησιά του Αιγαίου δέχονται εκατομμύρια επισκέπτες, ενώ αυξημένη κίνηση παρατηρείται και σε προορισμούς της ηπειρωτικής χώρας. Ωστόσο, οι κάτοικοι εκφράζουν ανησυχίες για τον υπερτουρισμό: οι τιμές των ενοικίων εκτοξεύονται, οι υποδομές πιέζονται και το νερό σπανίζει σε αρκετά νησιά. Οι ειδικοί προτείνουν μέτρα για βιώσιμη ανάπτυξη, όπως όρια στα κρουαζιερόπλοια και κίνητρα για επιμήκυνση της σεζόν. Η πρόκληση είναι να διατηρηθεί η ισορροπία ανάμεσα στα έσοδα και στην ποιότητα ζωής των ντόπιων.",
gloss:["σύμφωνα|σύμφωνα με|according to","στοιχεία|το στοιχείο|data, figures","υπουργείου|το υπουργείο|ministry","αφίξεις|η άφιξη|arrival","τουριστών|ο τουρίστας|tourist","σημείωσαν|σημειώνω|to record, register","φέτος|φέτος|this year","ρεκόρ|το ρεκόρ|record","νησιά|το νησί|island","αιγαίου|το Αιγαίο|the Aegean","δέχονται|δέχομαι|to receive","εκατομμύρια|το εκατομμύριο|million","επισκέπτες|ο επισκέπτης|visitor","αυξημένη|αυξημένος|increased","κίνηση|η κίνηση|traffic, activity","παρατηρείται|παρατηρούμαι|to be observed","προορισμούς|ο προορισμός|destination","ηπειρωτικής|ηπειρωτικός|mainland (adj.)","χώρας|η χώρα|country","ωστόσο|ωστόσο|however, nevertheless","κάτοικοι|ο κάτοικος|resident, inhabitant","εκφράζουν|εκφράζω|to express","ανησυχίες|η ανησυχία|concern, worry","υπερτουρισμό|ο υπερτουρισμός|overtourism","τιμές|η τιμή|price","ενοικίων|το ενοίκιο|rent","εκτοξεύονται|εκτοξεύομαι|to skyrocket|Literally: to be launched","υποδομές|η υποδομή|infrastructure","πιέζονται|πιέζομαι|to be strained, under pressure","σπανίζει|σπανίζω|to be scarce","αρκετά|αρκετός|several, quite a few","ειδικοί|ο ειδικός|expert, specialist","προτείνουν|προτείνω|to propose","μέτρα|το μέτρο|measure","βιώσιμη|βιώσιμος|sustainable","ανάπτυξη|η ανάπτυξη|development, growth","όρια|το όριο|limit","κρουαζιερόπλοια|το κρουαζιερόπλοιο|cruise ship","κίνητρα|το κίνητρο|incentive","επιμήκυνση|η επιμήκυνση|extension, lengthening","σεζόν|η σεζόν|season (tourism)","πρόκληση|η πρόκληση|challenge","διατηρηθεί|διατηρούμαι|to be maintained, preserved","ισορροπία|η ισορροπία|balance","ανάμεσα|ανάμεσα σε|between, among","έσοδα|τα έσοδα|revenue, income","ποιότητα|η ποιότητα|quality","ζωής|η ζωή|life","ντόπιων|ο ντόπιος|local (person)"]},
{id:"kaiki",level:"B2",topic:"The sea",title:"Ταξίδι με το καΐκι",
text:"Ξεκινήσαμε από το λιμάνι λίγο πριν την ανατολή. Ο καπετάνιος έλυσε τους κάβους και το καΐκι γλίστρησε αθόρυβα στα ήρεμα νερά. Καθώς βγήκαμε από τον κόλπο, το μελτέμι δυνάμωσε και τα κύματα άρχισαν να σκάνε στην πλώρη. Δελφίνια εμφανίστηκαν στα ανοιχτά και συνόδευσαν το σκάφος για ώρα. Αράξαμε σε μια απάνεμη αμμουδιά, όπου βουτήξαμε στα καταγάλανα νερά. Ο καπετάνιος έψησε φρέσκο ψάρι στη σχάρα και μας διηγήθηκε ιστορίες από τα νιάτα του, τότε που τα καΐκια κουβαλούσαν εμπορεύματα από νησί σε νησί.",
gloss:["ξεκινήσαμε|ξεκινώ|to set off, depart","λιμάνι|το λιμάνι|port, harbor","ανατολή|η ανατολή|sunrise; east","καπετάνιος|ο καπετάνιος|captain","έλυσε|λύνω|to untie, loosen","κάβους|ο κάβος|mooring line","καΐκι|το καΐκι|traditional wooden boat","καΐκια|το καΐκι|traditional wooden boat","γλίστρησε|γλιστρώ|to glide, slip","αθόρυβα|αθόρυβα|silently, noiselessly","ήρεμα|ήρεμος|calm","κόλπο|ο κόλπος|gulf, bay","μελτέμι|το μελτέμι|meltemi|The dry north wind of the Aegean summer","δυνάμωσε|δυναμώνω|to strengthen, pick up","κύματα|το κύμα|wave","σκάνε|σκάω|to break, burst","πλώρη|η πλώρη|bow (of a boat)|Opposite: η πρύμνη, the stern","δελφίνια|το δελφίνι|dolphin","εμφανίστηκαν|εμφανίζομαι|to appear","ανοιχτά|τα ανοιχτά|the open sea","συνόδευσαν|συνοδεύω|to accompany","σκάφος|το σκάφος|vessel, craft","αράξαμε|αράζω|to anchor, moor|In slang also: to chill, hang out","απάνεμη|απάνεμος|sheltered from the wind","αμμουδιά|η αμμουδιά|sandy beach","βουτήξαμε|βουτώ|to dive, plunge","καταγάλανα|καταγάλανος|deep blue|The prefix κατα- intensifies γαλανός","έψησε|ψήνω|to grill, roast","ψάρι|το ψάρι|fish","σχάρα|η σχάρα|grill","διηγήθηκε|διηγούμαι|to narrate, recount","ιστορίες|η ιστορία|story","νιάτα|τα νιάτα|youth, young years","κουβαλούσαν|κουβαλώ|to carry, haul","εμπορεύματα|το εμπόρευμα|goods, merchandise"]},

// ── Gloss maps ──
function glossMap(p){ const m={}; for(const line of p.gloss){ const [s,l,t,n] = line.split("|"); m[s.toLowerCase()] = {lemma:l, translation:t, note:n||""}; } return m; }
function allPassages(){ return [...customLib, ...BUNDLED]; }
function cleanWord(w){ return w.replace(/[.,;·!?»«"'()\[\]:—–…\d]/g,"").trim(); }

// Lightweight Modern Greek suffix stemmer — catches inflected forms offline.
// Returns candidate lemmas to try against the glossary.
function greekStemCandidates(word){
  const w = word.toLowerCase();
  const cands = new Set([w]);
  // suffix → replacement (endings ordered longest-first within each group)
  const rules = [
    // verbs (1st conj) → -ω
    [/άμε$/,"ω"],[/ούμε$/,"ώ"],[/ουμε$/,"ω"],[/άτε$/,"ω"],[/ετε$/,"ω"],
    [/ουν$/,"ω"],[/ούν$/,"ώ"],[/εις$/,"ω"],[/ει$/,"ω"],[/ανε$/,"ω"],
    // past tense → -ω/-ώ
    [/ήσαμε$/,"ώ"],[/ήσατε$/,"ώ"],[/ησαν$/,"ώ"],[/ησα$/,"ώ"],[/ησε$/,"ώ"],
    // nouns masc -ος
    [/ους$/,"ος"],[/ου$/,"ος"],[/οι$/,"ος"],[/ων$/,"ος"],[/ο$/,"ος"],
    // nouns fem -α / -η
    [/ας$/,"α"],[/ες$/,"α"],[/ας$/,"η"],[/ης$/,"η"],
    // neuter -ι
    [/ιού$/,"ι"],[/ιά$/,"ι"],[/ιών$/,"ι"],[/ια$/,"ι"],
    // adjectives
    [/η$/,"ος"],[/α$/,"ος"],
  ];
  for(const [re, end] of rules){
    if(re.test(w)) cands.add(w.replace(re, end));
  }
  // accent-normalized variants (Greek inflection often shifts the accent)
  const deaccent = x => x.normalize("NFD").replace(/[\u0300-\u0342]/g,"").normalize("NFC");
  for(const c of [...cands]) cands.add(deaccent(c));
  // loose stem fallback
  if(w.length>4){ cands.add(w.slice(0,-1)); cands.add(w.slice(0,-2)); }
  return [...cands];
}
function lookupWord(word, passage){
  const key = cleanWord(word).toLowerCase();
  if(!key) return null;
  if(passage){ const m = glossMap(passage); if(m[key]) return {...m[key], surface:key}; }
  for(const p of allPassages()){ const m = glossMap(p); if(m[key]) return {...m[key], surface:key}; }
  if(CORE[key]) return {lemma:key, translation:CORE[key], note:"Common function word", surface:key, core:true};
  // offline stemmer: try reduced forms against glossary + deck before giving up
  const cands = greekStemCandidates(key);
  for(const cand of cands){
    if(cand===key) continue;
    if(passage){ const m = glossMap(passage); if(m[cand]) return {...m[cand], surface:key, stemmed:true}; }
    for(const p of allPassages()){ const m = glossMap(p); if(m[cand]) return {...m[cand], surface:key, stemmed:true}; }
    const dc = deck.find(c=>c.lemma.toLowerCase()===cand || (c.forms||[]).map(f=>f.toLowerCase()).includes(cand));
    if(dc) return { lemma:dc.lemma, translation:dc.translation, note:dc.note||"", surface:key, stemmed:true };
  }
  return {surface:key, missing:true};
}

// ── Spaced repetition ──
function gradeCard(c, g){
  const now = Date.now();
  let {interval=0, ease=2.5, reps=0} = c;
  if(g==="again") return {...c, interval:0, reps:0, ease:Math.max(1.3,ease-0.2), due:now+600000, lapses:(c.lapses||0)+1};
  if(reps===0) interval = g==="easy"?3:1;
  else if(reps===1) interval = g==="easy"?7:3;
  else { const m = g==="hard"?1.2 : g==="easy"?ease*1.4 : ease; interval = Math.max(interval+1, Math.round(interval*m)); }
  if(g==="hard") ease = Math.max(1.3, ease-0.15);
  if(g==="easy") ease += 0.1;
  return {...c, interval, ease, reps:reps+1, due:now+interval*DAY};
}

// ── TTS (on-device) ──
// ── Playback engine: sentence-by-sentence for reliable pause/resume on iOS ──
let player = { pid:null, title:"", sentences:[], idx:0, playing:false, token:0 };

function speakText(text, rate, onend, keepQueue){
  try{
    if(!keepQueue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith("el"));
    if(v) u.voice = v;
    u.lang = "el-GR"; u.rate = rate || 0.92;
    let fired = false;
    u.onend = u.onerror = () => { if(fired) return; fired = true; if(onend) onend(); };
    speechSynthesis.speak(u);
  }catch(e){ console.error(e); if(onend) onend(); }
}

function splitSentences(t){ return t.split(/(?:(?<=[.;!?·…])\s+|\n+)/).filter(s=>s && s.trim()); }

function highlightSentence(si){
  document.querySelectorAll(".sentence.active").forEach(e=>e.classList.remove("active"));
  if(si==null) return;
  const el = document.querySelector(`.sentence[data-si="${si}"]`);
  if(el){ el.classList.add("active");
    el.scrollIntoView({ behavior:"smooth", block:"center" }); }
}
function speakChain(){
  const tk = player.token;
  if(!player.playing) { highlightSentence(null); render(); return; }
  if(player.idx >= player.sentences.length){ player.playing=false; player.idx=0; highlightSentence(null); render(); return; }
  const myIdx = player.idx;
  highlightSentence(myIdx);                              // karaoke: mark the sentence being read
  speakText(player.sentences[myIdx], curRate(), () => {
    if(player.token !== tk || !player.playing) return;   // cancelled or paused
    if(player.idx !== myIdx) return;                     // duplicate event — already advanced
    player.idx = myIdx + 1;
    speakChain();
  }, true);
}

function startPlayback(p){
  speechSynthesis.cancel();
  player = { pid:p.id, title:p.title, sentences:splitSentences(p.text), idx:0, playing:true, token:player.token+1 };
  speakChain(); render();
}
function pausePlayback(){
  player.playing = false; player.token++;
  speechSynthesis.cancel(); render();
}
function resumePlayback(){
  player.playing = true; player.token++;
  speechSynthesis.cancel();
  speakChain(); render();
}
function stopPlayback(){
  player.playing = false; player.idx = 0; player.pid = null; player.token++; highlightSentence(null);
  speechSynthesis.cancel(); render();
}
if("speechSynthesis" in window) speechSynthesis.getVoices(); // warm up voice list

        method:"POST",

          "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({ model, max_tokens:maxTokens||2000, messages:[{role:"user",content:prompt}] })
      });
      if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||("HTTP "+res.status)); }
      const d = await res.json();
      return d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
    }
  },
  gemini: {
    label: "Gemini (Google)",
    defaultModel: "gemini-3-flash",
    keyHint: "AIza…",
    keyUrl: "aistudio.google.com/apikey",
    note: "Has a FREE tier (Flash models) — no card needed. Great for a no-cost setup.",
    async call(prompt, maxTokens, model, key){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
      const res = await fetch(url, {
        method:"POST", headers:{ "content-type":"application/json" },
        body: JSON.stringify({ contents:[{ parts:[{ text:prompt }] }],
          generationConfig:{ maxOutputTokens:maxTokens||2000 } })
      });
      if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||("HTTP "+res.status)); }
      const d = await res.json();
      return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("\n");
    }
  },
  openai: {
    label: "OpenAI / OpenRouter / other",
    defaultModel: "gpt-5.6",
    keyHint: "sk-… or sk-or-…",
    keyUrl: "platform.openai.com or openrouter.ai/keys",
    note: "OpenAI-format. For OpenRouter (400+ models incl. Claude/Gemini/Llama) set Base URL to https://openrouter.ai/api/v1 and use a model like anthropic/claude-sonnet-5.",

      const res = await fetch(base.replace(/\/$/,"") + "/chat/completions", {
        method:"POST", headers:{ "content-type":"application/json", "authorization":"Bearer "+key },
        body: JSON.stringify({ model, max_tokens:maxTokens||2000, messages:[{role:"user",content:prompt}] })
      });
      if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||e?.error||("HTTP "+res.status)); }
      const d = await res.json();
      return d.choices?.[0]?.message?.content || "";
    }
  }
};
function currentProvider(){ return PROVIDERS[settings.provider] || PROVIDERS.anthropic; }
function currentModel(){ return (settings.models && settings.models[settings.provider]) || currentProvider().defaultModel; }

async function callAI(prompt, maxTokens){
  const prov = currentProvider();
  const key = settings.apiKey;
  const model = currentModel();
  const text = await prov.call(prompt, maxTokens, model, key);
  return String(text||"").replace(/```json|```/g,"").trim();
}

async function glossPastedText(text){
  if(!settings.apiKey){ genMsg = "Add an AI provider key in Settings first (tap \"How this works\")."; render(); return; }
  if(!navigator.onLine){ genMsg = "You're offline — glossing needs internet."; render(); return; }
  genBusy = true; genMsg = "Glossing your text…"; render();
  const prompt = `A Greek learner pasted this text. Clean it up lightly (fix obvious spacing/OCR issues, keep the original wording and line breaks), give it a short Greek title, and gloss EVERY content word (skip articles, common particles, prepositions). For each: exact surface form as it appears (lowercase), dictionary lemma with article, concise English translation in context, optional short note.
TEXT:\n"""${text.slice(0,4000)}"""
Respond ONLY with valid JSON, no markdown:
{"title":"short Greek title","text":"the cleaned passage","gloss":[["surface","lemma","translation","note or empty"],...]}`;
  try{
    const raw = await callClaude(prompt, 4000);
    const p = JSON.parse(raw);
    const entry = { id:"paste-"+Date.now(), level:settings.level, topic:"pasted", title:p.title,
      text:p.text, gloss:p.gloss.map(g=>g.join("|")), cached:true };
    customLib = [entry, ...customLib];
    save(LS.lib, customLib);
    genMsg = ""; activeP = entry; lookupState = null;
  }catch(e){ genMsg = "Glossing failed: " + e.message; }
  genBusy = false; render();
}
async function generateAndCache(topic){
  if(!settings.apiKey){ genMsg = "Add an AI provider key in Settings first (tap \"How this works\")."; render(); return; }
  if(!navigator.onLine){ genMsg = "You're offline — generation needs internet."; render(); return; }
  genBusy = true; genMsg = "Generating and glossing a new passage…"; render();
  const due = deck.filter(c=>c.due<=Date.now()).slice(0,8).map(c=>c.lemma);
  const spec = LEVEL_SPECS[settings.level] || LEVEL_SPECS.B2;
  const isDlg = (settings.format || "narrative") === "dialogue";
  const prompt = `You are a Greek tutor creating reading material for ${spec}

Write a Modern Greek ${isDlg ? "dialogue" : "passage"} on: "${topic}".${isDlg ? `

Format it as a natural spoken conversation between two people. Each utterance goes on its own line, starting with an em-dash (—). Use genuinely colloquial SPOKEN Greek — the fillers, interjections and particles real speakers use (λοιπόν, έλα, ρε συ, ας πούμε, καλέ, βρε) suited to the level — not written-register Greek. Include the small conversational moves: greetings, reacting, agreeing, teasing, changing subject.` : ""}${(due.length && !["A1","A2"].includes(settings.level)) ? ` Where natural, include some of these study words: ${due.join(", ")}.` : ""}

Respond ONLY with valid JSON, no markdown:
{"title":"short Greek title","text":"the passage","gloss":[["surface","lemma","translation","note or empty string"],...]}`;
  try{
    const raw = await callClaude(prompt, 3500);
    const p = JSON.parse(raw);
    const entry = {
      id: "gen-"+Date.now(), level: settings.level, topic, title: p.title, text: p.text,
      gloss: p.gloss.map(g => g.join("|")), cached: true
    };
    customLib = [entry, ...customLib];
    save(LS.lib, customLib);
    genMsg = ""; activeP = entry; lookupState = null;
  }catch(e){ genMsg = "Generation failed: " + e.message; }
  genBusy = false; render();
}

async function liveLookup(word, sentence, passage){
  lookupState = {surface: cleanWord(word).toLowerCase(), loading:true}; render();
  const prompt = `A Greek learner tapped "${cleanWord(word)}" in: "${sentence}". Respond ONLY with JSON, no markdown: {"lemma":"dictionary form with article","translation":"concise English meaning in this context","note":"one short usage/root note"}`;
  try{
    const raw = await callClaude(prompt, 500);
    const d = JSON.parse(raw);
    lookupState = {surface: cleanWord(word).toLowerCase(), lemma:d.lemma, translation:d.translation, note:d.note||"", sentence};
    // cache into the passage gloss so it's offline next time
    if(passage && passage.cached){
      passage.gloss.push([lookupState.surface, d.lemma, d.translation, d.note||""].join("|"));
      customLib = customLib.map(p => p.id===passage.id ? passage : p);
      save(LS.lib, customLib);
    }
  }catch(e){ lookupState = {surface: cleanWord(word).toLowerCase(), missing:true, error:e.message}; }
  render();
}

// ── Deck ops ──
function savedForms(){ return new Set(deck.flatMap(c => (c.forms||[c.lemma]).map(f=>f.toLowerCase()))); }
function dueCards(){ return deck.filter(c=>c.due<=Date.now()); }

function saveLookup(){
  const l = lookupState;
  if(!l || l.missing || l.core) return;
  const ex = deck.find(c=>c.lemma.toLowerCase()===l.lemma.toLowerCase());
  if(ex){ ex.forms = [...new Set([...(ex.forms||[]), l.surface])]; }
  else deck.push({ id:Date.now(), lemma:l.lemma, translation:l.translation, note:l.note||"",
    context:l.sentence||"", forms:[l.surface, l.lemma], due:Date.now(), interval:0, ease:2.5, reps:0, added:Date.now() });
  save(LS.deck, deck);
  lookupState.saved = true; render();
}

function clozeSentence(context, card){
  // blank out the card's surface form (or lemma) in its context sentence
  const forms = [...(card.forms||[]), card.lemma].filter(Boolean)
    .sort((a,b)=>b.length-a.length); // longest first
  let out = esc(context);
  for(const f of forms){
    const re = new RegExp("("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")", "i");
    if(re.test(out)){ out = out.replace(re, '<span style="color:#C89B3C;font-weight:700;">_____</span>'); break; }
  }
  return out;
}
window.setReviewMode = m => { reviewMode = m; revealed = false; render(); };
function startReview(){
  queue = dueCards().sort((a,b)=>a.due-b.due).slice(0,30);

function answer(g){
  const c = queue[0]; const u = gradeCard(c, g);
  deck = deck.map(x=>x.id===c.id?u:x); save(LS.deck, deck);
  queue = queue.slice(1); if(g==="again") queue.push(u);
  revealed = false; sessionDone++; render();
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function passageHTML(p){
  const known = savedForms();
  // Build spans from the SAME array the tap-lookup uses (unified sentence indexing),
  // and wrap each sentence so audio playback can highlight it (karaoke).
  const sentences = splitSentences(p.text);
  return sentences.map((sentence, si) => {
    const htmlSent = sentence.split(/(\s+)/).map(tok => {
      if(/^\s+$/.test(tok) || !cleanWord(tok)) return esc(tok);
      const w = cleanWord(tok).toLowerCase();
      const k = known.has(w) ? " known" : "";
      return `<span class="word${k}" data-si="${si}" data-w="${esc(tok)}">${esc(tok)}</span>`;
    }).join("");
    return `<span class="sentence" data-si="${si}">${htmlSent}</span> `;
  }).join("");
}

  // save the key field first so switching doesn't lose an entered key
  if($("keyIn")) settings.apiKey = $("keyIn").value.trim();
  settings.provider = pk; save(LS.settings, settings); render();
};
window.showApiHelp = () => { apiHelpOpen = true; render(); };
window.closeApiHelp = () => { apiHelpOpen = false; render(); };
window.exportDeck = () => {
  const blob = new Blob([JSON.stringify({deck, customLib}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lexis-backup.json"; a.click();
};
window.pasteGo = () => { const t=document.getElementById("pasteIn").value.trim(); if(t) glossPastedText(t); };
window.exportAnki = () => {
  if(!deck.length){ const m=document.getElementById("importMsg"); if(m) m.textContent="Deck is empty."; return; }
  const esc = v => '"' + String(v||"").replace(/"/g,'""') + '"';
  const tsv = deck.map(c => [esc(c.lemma), esc(c.translation), esc(c.context||""), esc(c.note||"")].join("\t")).join("\n");
  const blob = new Blob([tsv], { type:"text/tab-separated-values" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lexis-anki.tsv"; a.click();
};
window.importDeck = (ev) => {
  const file = ev.target.files[0]; if(!file) return;
  const msg = document.getElementById("importMsg");
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      let addedCards = 0, addedLib = 0;
      if(Array.isArray(d.deck)){
        const have = new Set(deck.map(c=>c.lemma));
        for(const c of d.deck){ if(c && c.lemma && !have.has(c.lemma)){ deck.push(c); have.add(c.lemma); addedCards++; } }
      }
      if(Array.isArray(d.customLib)){
        const have = new Set(customLib.map(p=>p.id));
        for(const p of d.customLib){ if(p && p.id && !have.has(p.id)){ customLib.push(p); have.add(p.id); addedLib++; } }
      }
      save(LS.deck, deck); save(LS.lib, customLib);
      if(msg) msg.textContent = `Imported ${addedCards} card(s) and ${addedLib} passage(s). Merged with existing — nothing overwritten.`;
      render();
    }catch(e){ if(msg) msg.textContent = "Import failed: "+e.message; }
  };
  r.readAsText(file);
};
window.addEventListener("online", render);
window.addEventListener("offline", render);

// register service worker for offline shell
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

render();
</script>
</body>
