<style>
  @import url('https://fonts.googleapis.com/css2?family=GFS+Didot&family=Source+Sans+3:wght@400;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#F7F5F0 0%,#EFEDE6 100%);
         font-family:'Source Sans 3','Noto Sans',system-ui,sans-serif; color:#1F2933; }
  .display { font-family:'GFS Didot','Georgia',serif; }
  header { background:#1E3A5C; color:#F7F5F0; padding:calc(16px + env(safe-area-inset-top)) 16px 14px; }
  .hrow { max-width:680px; margin:0 auto; display:flex; justify-content:space-between; align-items:baseline; }
  .shell { max-width:680px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)); }
  .tabs { max-width:680px; margin:0 auto; display:flex; gap:8px; padding:14px 16px 4px; flex-wrap:wrap; }
  .chip { padding:8px 14px; border-radius:999px; border:1.5px solid rgba(30,58,92,.25); background:transparent;
          color:#1E3A5C; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .chip.on { border-color:#1E3A5C; background:#1E3A5C; color:#F7F5F0; }
  .btn { padding:12px 20px; border-radius:10px; border:none; background:#1E3A5C; color:#F7F5F0;
         font-weight:600; font-size:15px; cursor:pointer; font-family:inherit; }
  .btn.sec { background:transparent; border:1.5px solid #1E3A5C; color:#1E3A5C; }
  .btn:disabled { opacity:.55; }
  .card { background:#fff; border-radius:14px; padding:20px; margin-top:12px;
          box-shadow:0 1px 3px rgba(31,41,51,.08),0 8px 24px rgba(31,41,51,.05); }
  .word { cursor:pointer; border-bottom:1px dotted rgba(30,58,92,.35); border-radius:2px; }
  .sentence { border-radius:5px; transition:background .2s ease; padding:1px 0; }
  .sentence.active { background:rgba(200,155,60,.20); box-shadow:0 0 0 3px rgba(200,155,60,.20); }
  .word.known { border-bottom:2px solid #C89B3C; background:rgba(200,155,60,.12); }
  .passage { font-size:19px; line-height:2.05; margin:14px 0 4px; }
  .muted { font-size:12.5px; color:#6B7683; }
  .lookup { border-left:4px solid #C89B3C; }
  .grades { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
  .grades button { padding:12px 4px; border-radius:10px; border:none; color:#fff; font-weight:700;
                   font-size:14px; cursor:pointer; font-family:inherit; }
  input[type=text], input[type=password], select {
    width:100%; padding:12px; border-radius:10px; border:1.5px solid rgba(30,58,92,.3);
    font-size:15px; font-family:inherit; background:#fff; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.04em; }
  .badge.bundled { background:rgba(30,58,92,.1); color:#1E3A5C; }
  .badge.cached { background:rgba(200,155,60,.18); color:#8A6D1F; }
  .hidden { display:none; }
</style>
</head>

{id:"panigiri",level:"B1",topic:"Village life",title:"Το πανηγύρι του χωριού",
text:"Κάθε καλοκαίρι, στις δεκαπέντε Αυγούστου, το χωριό μας γιορτάζει το μεγάλο πανηγύρι της Παναγίας. Από το πρωί οι καμπάνες χτυπούν χαρούμενα και οι γυναίκες στολίζουν την εκκλησία με λουλούδια. Το βράδυ, στην πλατεία, στήνονται τραπέζια κάτω από τα πλατάνια. Οι οργανοπαίχτες κουρδίζουν τα όργανά τους και σιγά σιγά αρχίζει ο χορός. Ψήνονται σουβλάκια και αρνιά στη σούβλα, ενώ το κρασί ρέει άφθονο. Οι ξενιτεμένοι επιστρέφουν από το εξωτερικό για να βρεθούν με τους δικούς τους. Μικροί και μεγάλοι πιάνονται χέρι χέρι και χορεύουν μέχρι τα ξημερώματα. Το πανηγύρι δεν είναι απλώς μια γιορτή· είναι η ψυχή του χωριού.",

{id:"giagia",level:"B1",topic:"Food",title:"Η κουζίνα της γιαγιάς",
text:"Η γιαγιά μου ξυπνούσε πάντα με το χάραμα. Ζύμωνε ψωμί στη σκάφη και το έψηνε στον ξυλόφουρνο της αυλής. Η μυρωδιά απλωνόταν σε όλη τη γειτονιά. Το μεσημέρι μαγείρευε φαγητά κατσαρόλας: φασολάκια λαδερά, γεμιστά, μοσχάρι κοκκινιστό. Τα μυστικά της ήταν απλά — φρέσκα υλικά από τον κήπο, λάδι από τις δικές μας ελιές και υπομονή. Ποτέ δεν μετρούσε με ακρίβεια· έβαζε «όσο πάρει». Εμείς τα παιδιά κλέβαμε κομμάτια ζεστό ψωμί και μας κυνηγούσε γελώντας με την ποδιά της. Σήμερα προσπαθώ να φτιάξω τις συνταγές της, μα κάτι πάντα λείπει.",

{id:"tourismos",level:"B2",topic:"News",title:"Ο τουρισμός φέτος",
text:"Σύμφωνα με τα στοιχεία του υπουργείου, οι αφίξεις τουριστών σημείωσαν φέτος νέο ρεκόρ. Τα νησιά του Αιγαίου δέχονται εκατομμύρια επισκέπτες, ενώ αυξημένη κίνηση παρατηρείται και σε προορισμούς της ηπειρωτικής χώρας. Ωστόσο, οι κάτοικοι εκφράζουν ανησυχίες για τον υπερτουρισμό: οι τιμές των ενοικίων εκτοξεύονται, οι υποδομές πιέζονται και το νερό σπανίζει σε αρκετά νησιά. Οι ειδικοί προτείνουν μέτρα για βιώσιμη ανάπτυξη, όπως όρια στα κρουαζιερόπλοια και κίνητρα για επιμήκυνση της σεζόν. Η πρόκληση είναι να διατηρηθεί η ισορροπία ανάμεσα στα έσοδα και στην ποιότητα ζωής των ντόπιων.",
gloss:["σύμφωνα|σύμφωνα με|according to","στοιχεία|το στοιχείο|data, figures","υπουργείου|το υπουργείο|ministry","αφίξεις|η άφιξη|arrival","τουριστών|ο τουρίστας|tourist","σημείωσαν|σημειώνω|to record, register","φέτος|φέτος|this year","ρεκόρ|το ρεκόρ|record","νησιά|το νησί|island","αιγαίου|το Αιγαίο|the Aegean","δέχονται|δέχομαι|to receive","εκατομμύρια|το εκατομμύριο|million","επισκέπτες|ο επισκέπτης|visitor","αυξημένη|αυξημένος|increased","κίνηση|η κίνηση|traffic, activity","παρατηρείται|παρατηρούμαι|to be observed","προορισμούς|ο προορισμός|destination","ηπειρωτικής|ηπειρωτικός|mainland (adj.)","χώρας|η χώρα|country","ωστόσο|ωστόσο|however, nevertheless","κάτοικοι|ο κάτοικος|resident, inhabitant","εκφράζουν|εκφράζω|to express","ανησυχίες|η ανησυχία|concern, worry","υπερτουρισμό|ο υπερτουρισμός|overtourism","τιμές|η τιμή|price","ενοικίων|το ενοίκιο|rent","εκτοξεύονται|εκτοξεύομαι|to skyrocket|Literally: to be launched","υποδομές|η υποδομή|infrastructure","πιέζονται|πιέζομαι|to be strained, under pressure","σπανίζει|σπανίζω|to be scarce","αρκετά|αρκετός|several, quite a few","ειδικοί|ο ειδικός|expert, specialist","προτείνουν|προτείνω|to propose","μέτρα|το μέτρο|measure","βιώσιμη|βιώσιμος|sustainable","ανάπτυξη|η ανάπτυξη|development, growth","όρια|το όριο|limit","κρουαζιερόπλοια|το κρουαζιερόπλοιο|cruise ship","κίνητρα|το κίνητρο|incentive","επιμήκυνση|η επιμήκυνση|extension, lengthening","σεζόν|η σεζόν|season (tourism)","πρόκληση|η πρόκληση|challenge","διατηρηθεί|διατηρούμαι|to be maintained, preserved","ισορροπία|η ισορροπία|balance","ανάμεσα|ανάμεσα σε|between, among","έσοδα|τα έσοδα|revenue, income","ποιότητα|η ποιότητα|quality","ζωής|η ζωή|life","ντόπιων|ο ντόπιος|local (person)"]},
{id:"kaiki",level:"B2",topic:"The sea",title:"Ταξίδι με το καΐκι",
text:"Ξεκινήσαμε από το λιμάνι λίγο πριν την ανατολή. Ο καπετάνιος έλυσε τους κάβους και το καΐκι γλίστρησε αθόρυβα στα ήρεμα νερά. Καθώς βγήκαμε από τον κόλπο, το μελτέμι δυνάμωσε και τα κύματα άρχισαν να σκάνε στην πλώρη. Δελφίνια εμφανίστηκαν στα ανοιχτά και συνόδευσαν το σκάφος για ώρα. Αράξαμε σε μια απάνεμη αμμουδιά, όπου βουτήξαμε στα καταγάλανα νερά. Ο καπετάνιος έψησε φρέσκο ψάρι στη σχάρα και μας διηγήθηκε ιστορίες από τα νιάτα του, τότε που τα καΐκια κουβαλούσαν εμπορεύματα από νησί σε νησί.",
gloss:["ξεκινήσαμε|ξεκινώ|to set off, depart","λιμάνι|το λιμάνι|port, harbor","ανατολή|η ανατολή|sunrise; east","καπετάνιος|ο καπετάνιος|captain","έλυσε|λύνω|to untie, loosen","κάβους|ο κάβος|mooring line","καΐκι|το καΐκι|traditional wooden boat","καΐκια|το καΐκι|traditional wooden boat","γλίστρησε|γλιστρώ|to glide, slip","αθόρυβα|αθόρυβα|silently, noiselessly","ήρεμα|ήρεμος|calm","κόλπο|ο κόλπος|gulf, bay","μελτέμι|το μελτέμι|meltemi|The dry north wind of the Aegean summer","δυνάμωσε|δυναμώνω|to strengthen, pick up","κύματα|το κύμα|wave","σκάνε|σκάω|to break, burst","πλώρη|η πλώρη|bow (of a boat)|Opposite: η πρύμνη, the stern","δελφίνια|το δελφίνι|dolphin","εμφανίστηκαν|εμφανίζομαι|to appear","ανοιχτά|τα ανοιχτά|the open sea","συνόδευσαν|συνοδεύω|to accompany","σκάφος|το σκάφος|vessel, craft","αράξαμε|αράζω|to anchor, moor|In slang also: to chill, hang out","απάνεμη|απάνεμος|sheltered from the wind","αμμουδιά|η αμμουδιά|sandy beach","βουτήξαμε|βουτώ|to dive, plunge","καταγάλανα|καταγάλανος|deep blue|The prefix κατα- intensifies γαλανός","έψησε|ψήνω|to grill, roast","ψάρι|το ψάρι|fish","σχάρα|η σχάρα|grill","διηγήθηκε|διηγούμαι|to narrate, recount","ιστορίες|η ιστορία|story","νιάτα|τα νιάτα|youth, young years","κουβαλούσαν|κουβαλώ|to carry, haul","εμπορεύματα|το εμπόρευμα|goods, merchandise"]},

async function initStorage(){
  try{
    const idb = await import("https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm");
    idbGet = idb.get; idbSet = idb.set;
  }catch(e){ console.error("idb import failed, using localStorage", e); }

  const read = async (k, fb) => {
    if(idbGet){ try{ const v = await idbGet(k); if(v !== undefined) return v; }catch(e){} }
    // one-time migration from old localStorage (or fallback if idb unavailable)
    try{ const ls = localStorage.getItem(k); if(ls != null){ const parsed = JSON.parse(ls);
      if(idbSet) idbSet(k, parsed).catch(()=>{}); return parsed; } }catch(e){}
    return fb;
  };

  deck      = await read(LS.deck, []);
  customLib = await read(LS.lib, []);
  settings  = await read(LS.settings, {});
  listened  = new Set(await read(LS.listened, []));
  practiceExtra = await read(LS.practiceX, {}) || {};

  // settings defaults / migrations
  const sd = { apiKey:"", model:"claude-sonnet-5", level:"B2", provider:"anthropic" };
  settings = Object.assign({}, sd, settings);
  if(!settings.provider) settings.provider = "anthropic";
  if(!settings.models) settings.models = {};
  // v22 migration: the multi-provider refactor read models from settings.models[provider],
  // silently dropping the legacy settings.model choice. Carry it over so the model the
  // user actually picked keeps being used.
  if(settings.model && !settings.models.anthropic) settings.models.anthropic = settings.model;

  // prime memCache so synchronous save() has current values
  memCache[LS.deck]=deck; memCache[LS.lib]=customLib;
  memCache[LS.settings]=settings; memCache[LS.listened]=[...listened];
  memCache[LS.practiceX]=practiceExtra;
}

// save() stays synchronous in signature (updates cache, fires async to IDB), so no call
// sites change. Everything loads once at startup via initStorage(). Lifts the ~5MB

function load(k, fb){ return (k in memCache) ? memCache[k] : fb; }
function save(k, v){
  memCache[k] = v;
  if(idbSet){ idbSet(k, v).catch(e=>console.error("idb save", k, e)); }
  else { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }  // pre-init fallback
}

// ── Gloss maps ──
function glossMap(p){ const m={}; for(const line of p.gloss){ const [s,l,t,n] = line.split("|"); m[(cleanWord(s)||s).toLowerCase()] = {lemma:l, translation:t, note:n||""}; } return m; }
function allPassages(){ return [...customLib.filter(inActiveLang), ...bundledPassages()]; }
function passageOrigin(p){
  if(p.origin) return p.origin;                          // new entries
  if(!p.cached) return "bundled";                        // bundled
  return (typeof p.id==="string" && p.id.startsWith("paste-")) ? "imported" : "generated"; // legacy
}
function cleanWord(w){ return w.replace(/[.,;·!?»«"'()\[\]:—–…\d]/g,"").trim(); }

// Lightweight Modern Greek suffix stemmer — catches inflected forms offline.
// Returns candidate lemmas to try against the glossary.
function elStem(word){
  const w = word.toLowerCase();
  const cands = new Set([w]);
  // suffix → replacement (endings ordered longest-first within each group)
  const rules = [
    // verbs (1st conj) → -ω
    [/άμε$/,"ω"],[/ούμε$/,"ώ"],[/ουμε$/,"ω"],[/άτε$/,"ω"],[/ετε$/,"ω"],
    [/ουν$/,"ω"],[/ούν$/,"ώ"],[/εις$/,"ω"],[/ει$/,"ω"],[/ανε$/,"ω"],
    // past tense → -ω/-ώ
    [/ήσαμε$/,"ώ"],[/ήσατε$/,"ώ"],[/ησαν$/,"ώ"],[/ησα$/,"ώ"],[/ησε$/,"ώ"],
    // nouns masc -ος
    [/ους$/,"ος"],[/ου$/,"ος"],[/οι$/,"ος"],[/ων$/,"ος"],[/ο$/,"ος"],
    // nouns fem -α / -η
    [/ας$/,"α"],[/ες$/,"α"],[/ας$/,"η"],[/ης$/,"η"],
    // neuter -ι
    [/ιού$/,"ι"],[/ιά$/,"ι"],[/ιών$/,"ι"],[/ια$/,"ι"],
    // adjectives
    [/η$/,"ος"],[/α$/,"ος"],
  ];
  for(const [re, end] of rules){
    if(re.test(w)) cands.add(w.replace(re, end));
  }
  // accent-normalized variants (Greek inflection often shifts the accent)
  const deaccent = x => x.normalize("NFD").replace(/[\u0300-\u0342]/g,"").normalize("NFC");
  for(const c of [...cands]) cands.add(deaccent(c));
  // loose stem fallback
  if(w.length>4){ cands.add(w.slice(0,-1)); cands.add(w.slice(0,-2)); }
  return [...cands];
}
function lookupWord(word, passage){
  const key = cleanWord(word).toLowerCase();
  if(!key) return null;
  if(passage){ const m = glossMap(passage); if(m[key]) return {...m[key], surface:key}; }
  for(const p of allPassages()){ const m = glossMap(p); if(m[key]) return {...m[key], surface:key}; }
  const CG = coreGloss(); if(CG[key]) return {lemma:key, translation:CG[key], note:"Common function word", surface:key, core:true};
  // offline stemmer: try reduced forms against glossary + deck before giving up
  const cands = langStem(key);
  for(const cand of cands){
    if(cand===key) continue;
    if(passage){ const m = glossMap(passage); if(m[cand]) return {...m[cand], surface:key, stemmed:true}; }
    for(const p of allPassages()){ const m = glossMap(p); if(m[cand]) return {...m[cand], surface:key, stemmed:true}; }
    const dc = deck.find(c=>c.lemma.toLowerCase()===cand || (c.forms||[]).map(f=>f.toLowerCase()).includes(cand));
    if(dc) return { lemma:dc.lemma, translation:dc.translation, note:dc.note||"", surface:key, stemmed:true };
  }
  return {surface:key, missing:true};
}

// ── Spaced repetition ──
function gradeCard(c, g){
  const now = Date.now();
  let {interval=0, ease=2.5, reps=0} = c;
  if(g==="again") return {...c, interval:0, reps:0, ease:Math.max(1.3,ease-0.2), due:now+600000, lapses:(c.lapses||0)+1};
  if(reps===0) interval = g==="easy"?3:1;
  else if(reps===1) interval = g==="easy"?7:3;
  else { const m = g==="hard"?1.2 : g==="easy"?ease*1.4 : ease; interval = Math.max(interval+1, Math.round(interval*m)); }
  if(g==="hard") ease = Math.max(1.3, ease-0.15);
  if(g==="easy") ease += 0.1;
  return {...c, interval, ease, reps:reps+1, due:now+interval*DAY};
}

// ── TTS (on-device) ──
// ── Playback engine: sentence-by-sentence for reliable pause/resume on iOS ──
let player = { pid:null, title:"", sentences:[], idx:0, playing:false, token:0 };

function speakText(text, rate, onend, keepQueue){
  try{
    if(!keepQueue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vp = voicePrefix(); const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(vp));
    if(v) u.voice = v;
    u.lang = voiceLangCode(); u.rate = rate || 0.92;
    let fired = false;
    u.onend = u.onerror = () => { if(fired) return; fired = true; if(onend) onend(); };
    speechSynthesis.speak(u);
  }catch(e){ console.error(e); if(onend) onend(); }
}

function splitSentences(t){ return t.split(/(?:(?<=[.;!?·…])\s+|\n+)/).filter(s=>s && s.trim()); }

function highlightSentence(si){
  document.querySelectorAll(".sentence.active").forEach(e=>e.classList.remove("active"));
  if(si==null) return;
  const el = document.querySelector(`.sentence[data-si="${si}"]`);
  if(el){ el.classList.add("active");
    el.scrollIntoView({ behavior:"smooth", block:"center" }); }
}
function speakChain(){
  const tk = player.token;
  if(!player.playing) { highlightSentence(null); render(); return; }
  if(player.idx >= player.sentences.length){ player.playing=false; player.idx=0; highlightSentence(null);
    if(player.pid){ listened.add(player.pid); save(LS.listened, [...listened]); } render(); return; }
  const myIdx = player.idx;
  highlightSentence(myIdx);                              // karaoke: mark the sentence being read
  speakText(player.sentences[myIdx], curRate(), () => {
    if(player.token !== tk || !player.playing) return;   // cancelled or paused
    if(player.idx !== myIdx) return;                     // duplicate event — already advanced
    player.idx = myIdx + 1;
    speakChain();
  }, true);
}

function startPlayback(p){
  speechSynthesis.cancel();
  player = { pid:p.id, title:p.title, sentences:splitSentences(p.text), idx:0, playing:true, token:player.token+1 };
  speakChain(); render();
}
function pausePlayback(){
  player.playing = false; player.token++;
  speechSynthesis.cancel(); render();
}
function resumePlayback(){
  player.playing = true; player.token++;
  speechSynthesis.cancel();
  speakChain(); render();
}
function stopPlayback(){
  player.playing = false; player.idx = 0; player.pid = null; player.token++; highlightSentence(null);
  speechSynthesis.cancel(); render();
}
if("speechSynthesis" in window) speechSynthesis.getVoices(); // warm up voice list

// ── Anthropic API (online mode, bring-your-own-key) ──
// ── Provider registry: each defines endpoint, headers, request body, and response parsing ──
// Shared Anthropic request: thinking disabled first (gloss/JSON tasks need no reasoning, and on
// thinking-by-default models like Sonnet 5 an unbounded think can eat the whole max_tokens and
// return zero text). If the model rejects the thinking parameter, retry once without it.
async function anthropicFetch(body, key){
  const doFetch = b => fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify(b)
  });
  let res = await doFetch({ ...body, thinking:{ type:"disabled" } });
  if(res.status === 400){
    const e = await res.json().catch(()=>({}));
    const msg = e?.error?.message || "";
    if(/thinking/i.test(msg)) res = await doFetch(body);          // model doesn't take the param — plain retry
    else throw new Error(msg || "HTTP 400");
  }
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||("HTTP "+res.status)); }
  const d = await res.json();
  const out = d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(!out.trim() && d.stop_reason) throw new Error("the model returned no text (stop_reason: "+d.stop_reason+") — its token budget may have gone to internal reasoning; try again");
  return out;
}

function currentModel(){ return (settings.models && settings.models[settings.provider]) || currentProvider().defaultModel; }

async function callAI(prompt, maxTokens){
  const prov = currentProvider();
  const key = settings.apiKey;
  const model = currentModel();
  const text = await prov.call(prompt, maxTokens, model, key);
  return String(text||"").replace(/```json|```/g,"").trim();
}
async function callVision(prompt, b64, media, maxTokens){
  const prov = currentProvider();
  if(!prov.vision) throw new Error("This provider has no image support in the app.");
  const text = await prov.vision(prompt, b64, media, maxTokens, currentModel(), settings.apiKey);
  return String(text||"").replace(/```json|```/g,"").trim();
}
// Robust JSON extraction — tolerates preamble, fences, trailing prose, trailing commas.
function parseAIJSON(raw){
  if(!raw || !raw.trim()) throw new Error("empty response from the model — try again (thinking models sometimes spend their whole token budget reasoning)");
  let clean = raw.replace(/```json|```/g,"").trim();
  const firstObj = clean.indexOf("{"), firstArr = clean.indexOf("[");
  const cands = [firstObj, firstArr].filter(i=>i>=0);
  if(!cands.length) throw new Error("no JSON in response");
  const start = Math.min(...cands);
  const end = Math.max(clean.lastIndexOf("}"), clean.lastIndexOf("]"));
  let slice = (end>start) ? clean.slice(start, end+1) : clean.slice(start);
  try{ return JSON.parse(slice); }
  catch(e){ return JSON.parse(slice.replace(/,(\s*[}\]])/g,"$1")); }  // strip trailing commas
}
// Salvage a gloss object even if the JSON was truncated mid-array — recover the complete
// [surface,lemma,translation,note] rows and the title/text if present. Returns null if nothing usable.
function salvageGloss(raw){
  const clean = raw.replace(/```json|```/g,"").trim();
  let title = (clean.match(/"title"\s*:\s*"((?:[^"\\]|\\.)*)"/)||[])[1];
  let text  = (clean.match(/"text"\s*:\s*"((?:[^"\\]|\\.)*)"/)||[])[1];
  const rows = [];
  // match complete 4-string arrays: ["a","b","c","d"]
  const re = /\[\s*"((?:[^"\\]|\\.)*)"\s*,\s*"((?:[^"\\]|\\.)*)"\s*,\s*"((?:[^"\\]|\\.)*)"\s*,\s*"((?:[^"\\]|\\.)*)"\s*\]/g;
  let m; while((m = re.exec(clean))){ 
    try{ rows.push([JSON.parse('"'+m[1]+'"'),JSON.parse('"'+m[2]+'"'),JSON.parse('"'+m[3]+'"'),JSON.parse('"'+m[4]+'"')]); }
    catch(e){ rows.push([m[1],m[2],m[3],m[4]]); }
  }
  if(!rows.length) return null;
  return { title: title||"Captured text", text: text||"", gloss: rows, partial:true };
}

function plStem(word){
  const w = word.toLowerCase();
  const cands = new Set([w]);
  const rules = [
    // verbs → infinitive
    [/ują$/,"ować"],[/ujemy$/,"ować"],[/ujecie$/,"ować"],[/ujesz$/,"ować"],[/uje$/,"ować"],[/owali$/,"ować"],[/ował[ao]?$/,"ować"],
    [/aliśmy$/,"ać"],[/ali$/,"ać"],[/ał[ao]?$/,"ać"],[/amy$/,"ać"],[/acie$/,"ać"],[/ają$/,"ać"],[/asz$/,"ać"],[/am$/,"ać"],[/a$/,"ać"],
    [/iliśmy$/,"ić"],[/ili$/,"ić"],[/ił[ao]?$/,"ić"],[/imy$/,"ić"],[/icie$/,"ić"],[/isz$/,"ić"],[/i$/,"ić"],
    [/yliśmy$/,"yć"],[/yli$/,"yć"],[/ył[ao]?$/,"yć"],[/ymy$/,"yć"],[/ysz$/,"yć"],[/y$/,"yć"],
    // nouns — case endings
    [/ami$/,"a"],[/ach$/,"a"],[/ą$/,"a"],[/ę$/,"a"],[/y$/,"a"],[/i$/,"a"],[/o$/,"a"],
    [/ie$/,"a"],[/ie$/,"o"],[/u$/,"o"],[/em$/,"o"],
    [/owie$/,""],[/ów$/,""],[/owi$/,""],[/em$/,""],[/u$/,""],[/a$/,""],[/y$/,""],[/e$/,""],
    // adjectives → -y/-i
    [/ego$/,"y"],[/emu$/,"y"],[/ymi$/,"y"],[/ych$/,"y"],[/ym$/,"y"],[/ej$/,"y"],[/ą$/,"y"],[/e$/,"y"],[/a$/,"y"],
    [/iego$/,"i"],[/iemu$/,"i"],[/imi$/,"i"],[/ich$/,"i"],[/im$/,"i"],[/ie$/,"i"],[/ia$/,"i"],
  ];
  for(const [re, end] of rules){ if(re.test(w)) cands.add(w.replace(re, end)); }
  // strip Polish diacritics as a loose extra candidate set
  const flat = x => x.replace(/ą/g,"a").replace(/ę/g,"e").replace(/ó/g,"o").replace(/ł/g,"l").replace(/ż/g,"z").replace(/ź/g,"z").replace(/ć/g,"c").replace(/ś/g,"s").replace(/ń/g,"n");
  for(const c of [...cands]) cands.add(flat(c));
  if(w.length>4){ cands.add(w.slice(0,-1)); cands.add(w.slice(0,-2)); }
  return [...cands];
}

function activeLang(){ return (settings && settings.lang) || "el"; }
function activePack(){ return PACKS[activeLang()] || PACKS.el; }
// Language scoping: untagged legacy data is treated as Greek ("el").
function itemLang(x){ return (x && x.lang) || "el"; }
function inActiveLang(x){ return itemLang(x) === activeLang(); }
// Engine-facing accessors (replace the old globals; always reflect the active pack)
function coreGloss(){ return activePack().core; }
function bundledPassages(){ return activePack().bundled; }
function levelSpecs(){ return activePack().levelSpecs; }
function langName(){ return activePack().name; }
function langStem(w){ const p = activePack(); return p.stem ? p.stem(w) : [w.toLowerCase()]; }
function voiceLangCode(){ return activePack().voiceLang; }
function voicePrefix(){ return activePack().voicePrefix; }
function langHasArticles(){ return activePack().hasArticles !== false; }

function fileToB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);   // strip data: prefix
    r.onerror = () => rej(new Error("Could not read image"));
    r.readAsDataURL(file);
  });
}
async function photoGo(ev){
  const file = ev.target.files[0]; if(!file) return;
  analyzeOpen = true;
  if(!settings.apiKey){ genMsg = "Add an AI provider key in Settings first (tap \"How this works\")."; render(); return; }
  if(!navigator.onLine){ genMsg = "You're offline — reading a photo needs internet."; render(); return; }
  genBusy = true; genMsg = "Reading the photo…"; render();
  try{
    const b64 = await fileToB64(file);
    const media = file.type || "image/jpeg";
    const ocrPrompt = `Extract ALL the ${langName()} text visible in this image, exactly as written, preserving line breaks. Return ONLY the extracted text with no commentary, translation, or markdown. If there is no ${langName()} text, return an empty response.`;
    const text = await callVision(ocrPrompt, b64, media, 5000);
    if(!text || text.trim().length < 2){ genMsg = `No ${langName()} text found in that photo. Try a clearer, closer shot.`; genBusy=false; render(); return; }
    let ocr = text.trim();
    // Cap so the gloss JSON can't overflow the token limit (a full page can be too much at once)
    const CAP = 1500;
    if(ocr.length > CAP){ ocr = ocr.slice(0, CAP); genMsg = "Long text — glossing the first part…"; render(); }
    genBusy = false;              // let glossPastedText manage its own busy state
    await glossPastedText(ocr);   // reuse the gloss+cache pipeline
  }catch(e){ genMsg = "Photo read failed: " + e.message; genBusy = false; render(); }
}
async function glossPastedText(text){
  if(!settings.apiKey){ genMsg = "Add an AI provider key in Settings first (tap \"How this works\")."; render(); return; }
  if(!navigator.onLine){ genMsg = "You're offline — glossing needs internet."; render(); return; }
  genBusy = true; genMsg = "Glossing your text…"; render();
  const L = langName();
  const prompt = `A ${L} learner pasted this text. Clean it up lightly (fix obvious spacing/OCR issues, keep the original wording and line breaks), give it a short ${L} title, and gloss EVERY content word (skip articles, common particles, prepositions). For each: exact surface form as it appears (lowercase), dictionary lemma${langHasArticles()?" with article":""}, concise English translation in context, optional short note.${activePack().glossExtra ? " " + activePack().glossExtra : ""}
TEXT:\n"""${text.slice(0,4000)}"""
Respond ONLY with valid JSON, no markdown:
{"title":"short ${L} title","text":"the cleaned passage","gloss":[["surface","lemma","translation","note or empty"],...]}`;
  try{
    const raw = await callClaude(prompt, 16000);
    let p;
    try{ p = parseAIJSON(raw); }
    catch(e){ p = salvageGloss(raw); if(!p) throw new Error("couldn't read the gloss — try again or a shorter passage"); }
    // if the model didn't echo the text back (or it was truncated), fall back to the input text
    const passageText = (p.text && p.text.length > 10) ? p.text : text;
    const entry = { id:"paste-"+Date.now(), level:settings.level, topic:"imported",
      title:p.title || "Captured text", text:passageText, lang:activeLang(),
      gloss:(p.gloss||[]).map(g=>Array.isArray(g)?g.join("|"):g), cached:true, origin:"imported" };
    customLib = [entry, ...customLib];
    save(LS.lib, customLib);
    genMsg = p.partial ? `Saved with ${entry.gloss.length} words glossed (some may be missing — tap any word to look it up).` : "";
    activeP = entry; lookupState = null;
  }catch(e){ genMsg = "Glossing failed: " + e.message; }
  genBusy = false; render();
}
async function generateAndCache(topic){
  if(!settings.apiKey){ genMsg = "Add an AI provider key in Settings first (tap \"How this works\")."; render(); return; }
  if(!navigator.onLine){ genMsg = "You're offline — generation needs internet."; render(); return; }
  genBusy = true; genMsg = "Generating and glossing a new passage…"; render();
  const due = deck.filter(c=>inActiveLang(c) && c.due<=Date.now()).slice(0,8).map(c=>c.lemma);
  const LS_ = levelSpecs(); const spec = LS_[settings.level] || LS_.B2;
  const isDlg = (settings.format || "narrative") === "dialogue";
  const L = langName();
  const prompt = `You are a ${L} tutor creating reading material for ${spec}

Write a ${L} ${isDlg ? "dialogue" : "passage"} on: "${topic}".${isDlg ? `

Format it as a natural spoken conversation between two people. Each utterance goes on its own line, starting with an em-dash (—). Use genuinely colloquial SPOKEN ${L} — the fillers, interjections and particles real speakers use${activePack().fillers?` (${activePack().fillers})`:""} suited to the level — not written-register ${L}. Include the small conversational moves: greetings, reacting, agreeing, teasing, changing subject.` : ""}${(due.length && !["A1","A2"].includes(settings.level)) ? ` Where natural, include some of these study words: ${due.join(", ")}.` : ""}

Then gloss EVERY content word in the passage (skip only articles, common particles and prepositions). For each, give: the exact surface form as it appears (lowercase), the dictionary lemma${langHasArticles()?" with its article":""}, a concise English translation as used in context, and optionally a short usage note.${activePack().glossExtra ? " " + activePack().glossExtra : ""}

Respond ONLY with valid JSON, no markdown:
{"title":"short ${L} title","text":"the passage","gloss":[["surface","lemma","translation","note or empty string"],...]}`;
  try{
    const raw = await callClaude(prompt, 9000);
    let p;
    try{ p = parseAIJSON(raw); }
    catch(e){ p = salvageGloss(raw); if(!p || !p.text) throw e; }
    const entry = {
      id: "gen-"+Date.now(), level: settings.level, topic, title: p.title, text: p.text, lang: activeLang(),
      gloss: (p.gloss||[]).map(g => Array.isArray(g) ? g.join("|") : g), cached: true, origin:"generated"
    };
    customLib = [entry, ...customLib];
    save(LS.lib, customLib);
    genMsg = p.partial ? `Saved with ${entry.gloss.length} words glossed (some may be missing — tap any word to look it up).` : "";
    activeP = entry; lookupState = null;
  }catch(e){ genMsg = "Generation failed: " + e.message; }
  genBusy = false; render();
}

async function liveLookup(word, sentence, passage){
  lookupState = {surface: cleanWord(word).toLowerCase(), loading:true}; render();
  const prompt = `A ${langName()} learner tapped "${cleanWord(word)}" in: "${sentence}". Respond ONLY with JSON, no markdown: {"lemma":"dictionary form${langHasArticles()?" with article":""}","translation":"concise English meaning in this context","note":"one short usage/root note"}`;
  try{
    const raw = await callClaude(prompt, 1500);
    const d = parseAIJSON(raw);
    lookupState = {surface: cleanWord(word).toLowerCase(), lemma:d.lemma, translation:d.translation, note:d.note||"", sentence};
    // cache into the passage gloss so it's offline next time
    if(passage && passage.cached){
      passage.gloss.push([lookupState.surface, d.lemma, d.translation, d.note||""].join("|"));
      customLib = customLib.map(p => p.id===passage.id ? passage : p);
      save(LS.lib, customLib);
    }
  }catch(e){ lookupState = {surface: cleanWord(word).toLowerCase(), missing:true, error:e.message}; }
  render();
}

function savedForms(){ return new Set(deck.filter(inActiveLang).flatMap(c => (c.forms||[c.lemma]).map(f=>f.toLowerCase()))); }
function dueCards(){ return deck.filter(c=>inActiveLang(c) && c.due<=Date.now()); }

function saveLookup(){
  const l = lookupState;
  if(!l || l.missing || l.core) return;
  const ex = deck.find(c=>c.lemma.toLowerCase()===l.lemma.toLowerCase());
  if(ex){ ex.forms = [...new Set([...(ex.forms||[]), l.surface])]; }
  else deck.push({ id:Date.now(), lemma:l.lemma, translation:l.translation, note:l.note||"", lang:activeLang(),
    context:l.sentence||"", forms:[l.surface, l.lemma], due:Date.now(), interval:0, ease:2.5, reps:0, added:Date.now() });
  save(LS.deck, deck);
  lookupState.saved = true; render();
}

function clozeSentence(context, card){
  // blank out the card's surface form (or lemma) in its context sentence
  const forms = [...(card.forms||[]), card.lemma].filter(Boolean)
    .sort((a,b)=>b.length-a.length); // longest first
  let out = esc(context);
  for(const f of forms){
    const re = new RegExp("("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")", "i");
    if(re.test(out)){ out = out.replace(re, '<span style="color:#C89B3C;font-weight:700;">_____</span>'); break; }
  }
  return out;
}

function practiceTier(){ return settings.practiceTier || "A1"; }
function practiceDir(){ return settings.practiceDir || "target"; }   // target-first | english-first
function practicePool(){
  const base = (activePack().practice || {})[practiceTier()] || [];
  const extra = practiceExtra[activeLang()+":"+practiceTier()] || [];
  if(!extra.length) return base;
  const seen = new Set(base.map(e=>e.split("|")[0].toLowerCase()));
  const out = base.slice();
  for(const e of extra){ const s = String(e).split("|")[0].toLowerCase(); if(s && !seen.has(s)){ seen.add(s); out.push(e); } }
  return out;
}
// Grow the current tier with AI: 50 new level-appropriate words, deduped and cached offline.
async function expandPractice(){
  if(practiceBusy) return;
  if(!settings.apiKey){ practiceMsg = "Add an AI provider key in Settings first (tap \"How this works\")."; render(); return; }
  if(!navigator.onLine){ practiceMsg = "You're offline — growing the set needs internet."; render(); return; }
  practiceBusy = true; practiceMsg = "Asking the AI for 50 new " + practiceTier() + " words…"; render();
  const L = langName(), tier = practiceTier();
  const have = practicePool().map(e=>e.split("|")[0]);
  const prompt = `You are building a graded vocabulary drill for a ${L} learner at CEFR level ${tier}. Suggest 50 NEW high-frequency, genuinely useful ${L} words appropriate for exactly this level — single dictionary items (an occasional fixed two-word phrase is fine), no proper nouns. ${langHasArticles()?"Nouns must include their article. ":""}${activePack().glossExtra?activePack().glossExtra+" ":""}Do NOT repeat any of these existing words: ${have.join(", ")}.
Respond ONLY with valid JSON, no markdown: [["${L} word","concise English translation"],...]`;
  try{
    const raw = await callAI(prompt, 6000);
    const arr = parseAIJSON(raw);
    if(!Array.isArray(arr)) throw new Error("unexpected response shape");
    const key = activeLang()+":"+tier;
    const cur = practiceExtra[key] || [];
    const seen = new Set(have.map(s=>s.toLowerCase()));
    for(const it of cur) seen.add(String(it).split("|")[0].toLowerCase());
    let added = 0;
    for(const it of arr){
      if(!Array.isArray(it) || !it[0] || !it[1]) continue;
      const w = String(it[0]).trim(), t = String(it[1]).trim();
      if(!w || !t || seen.has(w.toLowerCase())) continue;
      seen.add(w.toLowerCase()); cur.push(w+"|"+t); added++;
    }
    practiceExtra[key] = cur; save(LS.practiceX, practiceExtra);
    practiceMsg = added ? `Added ${added} new words — cached on this device for offline practice.` : "No new words came back — try again.";
  }catch(e){ practiceMsg = "Couldn't grow the set: " + e.message; }
  practiceBusy = false; render();
}
window.expandPractice = expandPractice;
function nextPractice(){
  const pool = practicePool();
  if(!pool.length){ practiceWord = null; render(); return; }
  let pick, tries = 0;
  do { pick = pool[Math.floor(Math.random()*pool.length)]; tries++; } while(practiceHist.includes(pick) && tries < 25);
  practiceHist.push(pick); if(practiceHist.length > 6) practiceHist.shift();
  const [w, t] = pick.split("|");
  practiceWord = { word:w, translation:t }; practiceRevealed = false;
  render();
  if(practiceDir() === "target") speakText(w, wordRate());   // hear it before guessing the meaning
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function passageHTML(p){
  const known = savedForms();
  // Build spans from the SAME array the tap-lookup uses (unified sentence indexing),
  // and wrap each sentence so audio playback can highlight it (karaoke).
  const sentences = splitSentences(p.text);
  return sentences.map((sentence, si) => {
    const htmlSent = sentence.split(/(\s+)/).map(tok => {
      if(/^\s+$/.test(tok) || !cleanWord(tok)) return esc(tok);
      const w = cleanWord(tok).toLowerCase();
      const k = known.has(w) ? " known" : "";
      return `<span class="word${k}" data-si="${si}" data-w="${esc(tok)}">${esc(tok)}</span>`;
    }).join("");
    return `<span class="sentence" data-si="${si}">${htmlSent}</span> `;
  }).join("");
}

        <div class="muted">${queue.length} left</div>
        <div style="display:flex;gap:5px;">
          ${[["recognition","GR→EN"],["recall","EN→GR"],["cloze","Fill-in"]].map(([m,l])=>`<button class="chip${reviewMode===m?" on":""}" style="font-size:12px;padding:5px 9px;" onclick="setReviewMode('${m}')">${l}</button>`).join("")}
        </div></div>`;
      // build front/back by mode
      let front, back, canSpeak = true;
      if(reviewMode==="recall"){
        front = `<div class="display" style="font-size:24px;color:#1E3A5C;">${esc(c.translation)}</div>`;
        back  = `<div style="font-size:26px;font-weight:700;color:#1E3A5C;">${esc(c.lemma)}</div>${c.note?`<div style="font-size:14.5px;color:#4B5563;margin-top:8px;">${esc(c.note)}</div>`:""}`;
      } else if(reviewMode==="cloze" && c.context){
        const blanked = clozeSentence(c.context, c);
        front = `<div style="font-size:19px;color:#1E3A5C;line-height:1.6;">${blanked}</div><div class="muted" style="margin-top:10px;">${esc(c.translation)}</div>`;
        back  = `<div style="font-size:26px;font-weight:700;color:#1E3A5C;">${esc(c.lemma)}</div>`;
      } else {
        // recognition (default), and cloze fallback when no context
        front = `<div class="display" style="font-size:32px;color:#1E3A5C;">${esc(c.lemma)}</div>${(c.context)?`<div style="font-size:14.5px;color:#6B7683;margin-top:12px;font-style:italic;">«${esc(c.context)}»</div>`:""}`;
        back  = `<div style="font-size:19px;font-weight:700;">${esc(c.translation)}</div>${c.note?`<div style="font-size:14.5px;color:#4B5563;margin-top:8px;">${esc(c.note)}</div>`:""}`;
      }
      const speakTarget = esc(c.lemma).replace(/'/g,"\\'");
      html += `<div class="card" style="min-height:240px;display:flex;flex-direction:column;">
        <div style="flex:1;">
          <div class="row"><div>${front}</div>
          ${canSpeak?`<button style="background:none;border:none;font-size:20px;cursor:pointer;" onclick="speak('${speakTarget}',0.85)">🔊</button>`:""}</div>
          ${revealed?`<div style="margin-top:12px;border-top:1px solid #E5E1D8;padding-top:12px;">${back}</div>`:""}
        </div>
        ${!revealed
          ? `<button class="btn" style="margin-top:16px;" onclick="revealed=true;render()">Show answer</button>`
          : `<div class="grades">
              <button style="background:#B4432F;" onclick="answer('again')">Again</button>
              <button style="background:#A87614;" onclick="answer('hard')">Hard</button>
              <button style="background:#1E3A5C;" onclick="answer('good')">Good</button>
              <button style="background:#3E7C4F;" onclick="answer('easy')">Easy</button></div>`}
      </div>`;
    }
  }

  if(tab==="practice"){
    const pool = practicePool();
    const dir = practiceDir();
    const tierLabels = { A1:"A1 · Essentials", A2:"A2 · Everyday", B1:"B1 · Intermediate", B2:"B2 · Advanced" };
    html += `<div class="card" style="padding:14px 16px;">
      <div class="row"><div class="muted">Difficulty</div>
        <button class="btn sec" style="padding:5px 10px;font-size:12px;flex-shrink:0;" onclick="showCefrHelp()">Levels?</button></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        ${["A1","A2","B1","B2"].map(t=>`<button class="chip${practiceTier()===t?" on":""}" onclick="setPracticeTier('${t}')">${tierLabels[t]}</button>`).join("")}
      </div>
      <div class="muted" style="margin:12px 0 0;">Direction</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        <button class="chip${dir==="target"?" on":""}" onclick="setPracticeDir('target')">${esc(langName())} → English</button>
        <button class="chip${dir==="english"?" on":""}" onclick="setPracticeDir('english')">English → ${esc(langName())}</button>
      </div>
      <div class="row" style="margin-top:14px;">
        <div class="muted">${pool.length} words in this set${(practiceExtra[activeLang()+":"+practiceTier()]||[]).length?` · ${(practiceExtra[activeLang()+":"+practiceTier()]||[]).length} grown by AI`:""}</div>
        <button class="btn sec" style="padding:6px 12px;font-size:13px;flex-shrink:0;" onclick="expandPractice()" ${practiceBusy?"disabled":""}>${practiceBusy?"…":"＋ Grow with AI"}</button>
      </div>
      ${practiceMsg?`<div class="muted" style="margin-top:6px;color:#8A6D1F;">${esc(practiceMsg)}</div>`:""}
    </div>`;
    if(!practiceWord){
      html += `<div class="card" style="text-align:center;padding:36px;">
        <div class="display" style="font-size:24px;color:#1E3A5C;">Word practice</div>
        <div class="muted" style="margin-top:8px;line-height:1.6;">${pool.length} words in this set.${dir==="target"
          ? " Each word is spoken aloud — guess the meaning, then reveal."
          : ` You get the English — recall it in ${esc(langName())}, then reveal to check and hear it.`}</div>
        <button class="btn" style="margin-top:18px;" onclick="practiceNext()">Give me a word</button>
      </div>`;
    } else {
      const w = practiceWord;
      const speakBtn = `<button style="background:none;border:none;font-size:22px;cursor:pointer;" onclick="speak('${esc(w.word).replace(/'/g,"\\'")}',0.85)">🔊</button>`;
      const front = dir==="target"
        ? `<div class="row"><div class="display" style="font-size:34px;color:#1E3A5C;">${esc(w.word)}</div>${speakBtn}</div>`
        : `<div style="font-size:26px;font-weight:600;color:#1E3A5C;">${esc(w.translation)}</div>`;
      const back = dir==="target"
        ? `<div style="font-size:20px;font-weight:700;">${esc(w.translation)}</div>`
        : `<div class="row"><div class="display" style="font-size:30px;color:#1E3A5C;">${esc(w.word)}</div>${speakBtn}</div>`;
      html += `<div class="card" style="min-height:220px;display:flex;flex-direction:column;">
        <div style="flex:1;">${front}
          ${practiceRevealed?`<div style="margin-top:14px;border-top:1px solid #E5E1D8;padding-top:14px;">${back}
            <button class="btn sec" style="margin-top:14px;width:100%;${w.saved?'border-color:#3E7C4F;color:#3E7C4F;':''}" onclick="practiceSave()" ${w.saved?'disabled':''}>${w.saved?"✓ In your review deck":"+ Add to my review deck"}</button>
          </div>`:""}
        </div>
        ${!practiceRevealed
          ? `<button class="btn" style="margin-top:16px;" onclick="practiceReveal()">Show answer</button>`
          : `<button class="btn" style="margin-top:16px;" onclick="practiceNext()">Next word →</button>`}
      </div>
      <div class="muted" style="margin-top:10px;text-align:center;">Words you add here join the spaced-repetition Review tab.</div>`;
    }
  }

  if(tab==="words"){
    const myWords = deck.filter(inActiveLang);
    if(myWords.length===0) html += `<div class="card" style="text-align:center;color:#6B7683;">No words yet — tap words while reading to collect them.</div>`;
    else for(const c of [...myWords].sort((a,b)=>b.added-a.added)){
      html += `<div class="card row" style="padding:14px;">
        <div style="min-width:0;"><span class="display" style="font-size:18px;color:#1E3A5C;">${esc(c.lemma)}</span>
        <span style="font-size:14px;color:#4B5563;margin-left:10px;">${esc(c.translation)}</span>
        <div style="font-size:12px;color:#9AA3AE;margin-top:2px;">${c.due<=Date.now()?"due now":"next: "+new Date(c.due).toLocaleDateString()} · seen ${c.reps}×</div></div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button style="background:none;border:none;font-size:17px;cursor:pointer;" onclick="speak('${esc(c.lemma).replace(/'/g,"\\'")}',0.85)">🔊</button>
          <button style="background:none;border:none;font-size:15px;cursor:pointer;color:#B4432F;" onclick="delCard(${c.id})">✕</button></div></div>`;
    }
  }

  if(tab==="settings"){
    const prov = currentProvider();
    html += `<div class="card">
      <div style="font-weight:700;color:#1E3A5C;margin-bottom:6px;">Language</div>
      <div class="muted" style="margin-bottom:10px;">Choose the language you're learning. Your saved words, passages and review deck are kept separate for each language.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${Object.keys(PACKS).map(code=>{const p=PACKS[code];return `<button class="chip${activeLang()===code?" on":""}" onclick="setLang('${code}')"><span class="display">${esc(p.native)}</span> <span style="opacity:.7;">· ${esc(p.name)}</span></button>`;}).join("")}
      </div>
    </div>
    <div class="card">
      <div class="row"><div style="font-weight:700;color:#1E3A5C;">Online mode (optional)</div>
        <button class="btn sec" style="padding:6px 12px;font-size:13px;" onclick="showApiHelp()">How this works</button></div>
      <div class="muted" style="margin:6px 0 10px;">Bring your own AI key for unlimited custom passages and live lookups. Stored only on this phone. The bundled library always works without any key.</div>
      <label class="muted">AI provider</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;">
        ${Object.keys(PROVIDERS).map(pk=>`<button class="chip${settings.provider===pk?" on":""}" onclick="setProvider('${pk}')">${PROVIDERS[pk].label}</button>`).join("")}
      </div>
      <div class="muted" style="margin-bottom:8px;font-size:13px;color:#8A6D1F;">${esc(prov.note)}</div>
      <label class="muted">API key <span style="opacity:.7;">(get one at ${esc(prov.keyUrl)})</span></label>
      <input type="password" id="keyIn" placeholder="${esc(prov.keyHint)}" value="${esc(settings.apiKey)}" style="margin-top:4px;">
      <label class="muted" style="display:block;margin-top:10px;">Model <span style="opacity:.7;">(optional — default: ${esc(prov.defaultModel)})</span></label>
      <input type="text" id="modelIn" placeholder="${esc(prov.defaultModel)}" value="${esc((settings.models&&settings.models[settings.provider])||"")}" style="margin-top:4px;">
      ${settings.provider==="openai"?`<label class="muted" style="display:block;margin-top:10px;">Base URL <span style="opacity:.7;">(OpenRouter: https://openrouter.ai/api/v1)</span></label>
      <input type="text" id="baseIn" placeholder="https://api.openai.com/v1" value="${esc(settings.baseUrl||"")}" style="margin-top:4px;">`:""}
      <div style="margin-top:10px;">
        <label class="muted">Speech speed</label>
        <div style="display:flex;gap:6px;margin-top:6px;">
          ${[["fast","Fast"],["medium","Medium"],["slow","Slow"]].map(([k,l])=>`<button class="chip${(settings.speed||"fast")===k?" on":""}" onclick="setSpeed('${k}')">${l}</button>`).join("")}
        </div>
      </div>
      <div style="margin-top:10px;">
        <label class="muted">My level for generated texts</label>
        <select id="lvlIn">${["A1","A2","B1","B2","C1","C2"].map(l=>`<option ${settings.level===l?"selected":""}>${l}</option>`).join("")}</select>
      </div>
      <button class="btn" style="margin-top:14px;width:100%;" onclick="saveSettings()">Save settings</button>
      <div id="setMsg" class="muted" style="margin-top:8px;"></div>
    </div>
    <div class="card">
      <div style="font-weight:700;color:#1E3A5C;">Backup</div>
      <div class="muted" style="margin:6px 0 12px;">Your deck lives in this browser's storage. Export it occasionally as a safety net.</div>
      <button class="btn sec" style="width:100%;" onclick="exportDeck()">Export deck as JSON</button>
      <label class="btn sec" style="width:100%;display:block;text-align:center;margin-top:8px;box-sizing:border-box;">Import deck from JSON<input type="file" accept="application/json,.json" style="display:none;" onchange="importDeck(event)"></label>
      <button class="btn sec" style="width:100%;margin-top:8px;" onclick="exportAnki()">Export for Anki (.tsv)</button>
      <div id="importMsg" class="muted" style="margin-top:8px;"></div>
    </div>`;
  }

  if(cefrHelpOpen) html = cefrHelpHTML() + html;
  if(apiHelpOpen) html = apiHelpHTML() + html;
  $("main").innerHTML = html;

  // wire word taps (event delegation)
  const pb = $("passageBody");
  if(pb){
    const sentences = splitSentences(activeP.text);
    pb.querySelectorAll(".word").forEach(el=>{
      el.onclick = () => {
        const w = el.getAttribute("data-w"), si = +el.getAttribute("data-si");
        const sentence = sentences[si] || "";
        const r = lookupWord(w, activeP);
        if(r.missing && settings.apiKey && navigator.onLine){ liveLookup(w, sentence, activeP); return; }
        lookupState = {...r, sentence, saved:false}; render();
        // scroll lookup into view on phones
        setTimeout(()=>{ const c = document.querySelector(".lookup"); if(c) c.scrollIntoView({behavior:"smooth", block:"nearest"}); }, 50);
      };
    });
  }
}

// ── Actions exposed to inline handlers ──
window.setTab = t => { tab = t; if(t==="review") startReview(); render(); };
window.openP = id => { activeP = allPassages().find(p=>p.id===id); lookupState = null; render(); window.scrollTo(0,0); };
window.closeP = () => { activeP = null; lookupState = null; render(); };
window.togglePlay = () => {
  if(player.pid === activeP.id && player.playing) pausePlayback();
  else if(player.pid === activeP.id && player.idx > 0) resumePlayback();
  else startPlayback(activeP);
};
window.pausePB = pausePlayback;
window.resumePB = resumePlayback;
window.stopPB = stopPlayback;
window.delPassage = id => {
  if(!confirm("Delete this cached passage? Words you saved from it stay in your deck.")) return;
  if(player.pid === id) stopPlayback();
  customLib = customLib.filter(p=>p.id!==id);
  save(LS.lib, customLib);
  if(activeP && activeP.id===id) activeP = null;
  render();
};
window.speak = (t, r) => { if(player.playing) pausePlayback(); speakText(t, wordRate()); };
window.speakPassage = () => window.togglePlay();
window.saveLookup = saveLookup;
window.answer = answer;
window.delCard = delCard;
window.genGo = () => { generateOpen = true; const t = $("topicIn").value.trim() || (langName() + " current affairs"); generateAndCache(t); };
window.setSpeed = k => { settings.speed = k; save(LS.settings, settings); render(); };
window.setLang = code => {
  if(!PACKS[code] || code===activeLang()) return;
  settings.lang = code; save(LS.settings, settings);
  // Leaving the current language: clear the open passage & audio so we don't
  // show other-language content. Data stays scoped per-language via v15 filters.
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  activeP = null; player = { pid:null, title:"", sentences:[], idx:0, playing:false, token:player.token+1 };
  practiceWord = null; practiceRevealed = false; practiceHist = []; practiceMsg = "";
  tab = "read";
  render();
};
window.setFormat = f => {
  const typed = $("topicIn") ? $("topicIn").value : "";
  settings.format = f; save(LS.settings, settings);
  render();
  if($("topicIn")) $("topicIn").value = typed;
};
window.setLevel = l => {
  const typed = $("topicIn") ? $("topicIn").value : "";
  settings.level = l; save(LS.settings, settings);
  render();
  if($("topicIn")) $("topicIn").value = typed;
};
window.doLive = () => { if(lookupState) liveLookup(lookupState.surface, lookupState.sentence || "", activeP); };
window.saveSettings = () => {
  settings.apiKey = $("keyIn").value.trim();
  settings.level = $("lvlIn").value;
  if($("modelIn")){ const m=$("modelIn").value.trim(); settings.models = settings.models||{};
    if(m) settings.models[settings.provider]=m; else delete settings.models[settings.provider]; }
  if($("baseIn")) settings.baseUrl = $("baseIn").value.trim();
  save(LS.settings, settings);
  $("setMsg").textContent = "Saved ✓";
};
window.setProvider = (pk) => {
  // save the key field first so switching doesn't lose an entered key
  if($("keyIn")) settings.apiKey = $("keyIn").value.trim();
  settings.provider = pk; save(LS.settings, settings); render();
};
window.showApiHelp = () => { apiHelpOpen = true; render(); };
window.showCefrHelp = () => { cefrHelpOpen = true; render(); };
window.closeCefrHelp = () => { cefrHelpOpen = false; render(); };
window.setLibFilter = (kind, val) => { libFilter[kind] = val; render(); };
window.setLibSearch = (v) => { libFilter.q = v; render(); };
window.closeApiHelp = () => { apiHelpOpen = false; render(); };
window.exportDeck = () => {
  const blob = new Blob([JSON.stringify({deck, customLib}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lexis-backup.json"; a.click();
};
window.toggleAnalyze = () => { analyzeOpen = !analyzeOpen; render(); };
window.toggleGenerate = () => { generateOpen = !generateOpen; render(); };
window.pasteGo = () => { const t=document.getElementById("pasteIn").value.trim(); if(t){ analyzeOpen = true; glossPastedText(t); } };
window.photoGo = photoGo;
window.exportAnki = () => {
  const expCards = deck.filter(inActiveLang);
  if(!expCards.length){ const m=document.getElementById("importMsg"); if(m) m.textContent="Deck is empty for this language."; return; }
  const esc = v => '"' + String(v||"").replace(/"/g,'""') + '"';
  const tsv = expCards.map(c => [esc(c.lemma), esc(c.translation), esc(c.context||""), esc(c.note||"")].join("\t")).join("\n");
  const blob = new Blob([tsv], { type:"text/tab-separated-values" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lexis-anki.tsv"; a.click();
};
window.importDeck = (ev) => {
  const file = ev.target.files[0]; if(!file) return;
  const msg = document.getElementById("importMsg");
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      let addedCards = 0, addedLib = 0;
      if(Array.isArray(d.deck)){
        const have = new Set(deck.map(c=>c.lemma));
        for(const c of d.deck){ if(c && c.lemma && !have.has(c.lemma)){ deck.push(c); have.add(c.lemma); addedCards++; } }
      }
      if(Array.isArray(d.customLib)){
        const have = new Set(customLib.map(p=>p.id));
        for(const p of d.customLib){ if(p && p.id && !have.has(p.id)){ customLib.push(p); have.add(p.id); addedLib++; } }
      }
      save(LS.deck, deck); save(LS.lib, customLib);
      if(msg) msg.textContent = `Imported ${addedCards} card(s) and ${addedLib} passage(s). Merged with existing — nothing overwritten.`;
      render();
    }catch(e){ if(msg) msg.textContent = "Import failed: "+e.message; }
  };
  r.readAsText(file);
};
window.addEventListener("online", render);
window.addEventListener("offline", render);

// register service worker for offline shell
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

// Boot: load storage (async), then render.
document.getElementById("main").innerHTML = '<div style="padding:24px;color:#6B7683;">Loading…</div>';
initStorage().then(render).catch(e => {
  document.getElementById("main").innerHTML = '<div class="card">Storage failed to load: '+e.message+'</div>';
});
</script>
</body>
</html>
